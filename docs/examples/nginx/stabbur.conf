map $uri $stabbur_auth_limit_key {
    default "";
    /api/v1/auth/login $binary_remote_addr;
    /api/v1/auth/bootstrap $binary_remote_addr;
}

limit_req_zone $stabbur_auth_limit_key zone=stabbur_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name stabbur.example.net;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stabbur.example.net;

    ssl_certificate /etc/letsencrypt/live/stabbur.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stabbur.example.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2g;
    client_header_timeout 15s;
    client_body_timeout 24h;
    keepalive_timeout 75s;
    large_client_header_buffers 4 16k;

    limit_req zone=stabbur_auth burst=10 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }
}
