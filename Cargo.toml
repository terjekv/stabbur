[workspace]
members = [
    ".",
    "crates/stabbur-domain",
    "crates/stabbur-auth-core",
    "crates/stabbur-storage-conformance",
    "crates/stabbur-storage-core",
    "crates/stabbur-storage-runtime",
    "crates/stabbur-storage-sqlite",
    "crates/stabbur-store-core",
    "crates/stabbur-store-fs",
    "crates/stabbur-jobs-core",
    "crates/stabbur-builder-core",
    "crates/stabbur-builder-autopkg",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/terjekv/stabbur"

[workspace.dependencies]
actix-web = { version = "4.11", default-features = false, features = ["macros", "compress-gzip", "compress-brotli"] }
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-core = "0.3"
futures-util = "0.3"
fs2 = "0.4"
hex = "0.4"
http = "1.3"
plist = "1.7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# The driver crates have a semver-exempt public API and must move in lockstep.
# Using only the SQLite driver also keeps unused MySQL/PostgreSQL cryptography out of the lockfile.
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "migrate", "chrono", "uuid", "json"] }
sqlx-sqlite = { version = "=0.8.6", default-features = false, features = ["bundled", "migrate", "chrono", "uuid", "json"] }
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5.4", features = ["chrono", "uuid", "url"] }
uuid = { version = "1.18", features = ["v7", "serde"] }
yaml_serde = "0.10"

[package]
name = "stabbur-server"
description = "Stabbur software artifact control plane and worker runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actix-web.workspace = true
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true
stabbur-auth-core = { version = "0.0.1", path = "crates/stabbur-auth-core" }
stabbur-builder-autopkg = { version = "0.0.1", path = "crates/stabbur-builder-autopkg" }
stabbur-builder-core = { version = "0.0.1", path = "crates/stabbur-builder-core" }
stabbur-domain = { version = "0.0.1", path = "crates/stabbur-domain" }
stabbur-jobs-core = { version = "0.0.1", path = "crates/stabbur-jobs-core" }
stabbur-storage-core = { version = "0.0.1", path = "crates/stabbur-storage-core" }
stabbur-storage-runtime = { version = "0.0.1", path = "crates/stabbur-storage-runtime" }
stabbur-store-core = { version = "0.0.1", path = "crates/stabbur-store-core" }
stabbur-store-fs = { version = "0.0.1", path = "crates/stabbur-store-fs" }

[dev-dependencies]
actix-web = { workspace = true, features = ["cookies"] }

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
