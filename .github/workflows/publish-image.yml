name: Publish verified server image
on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful single-host integration run for this exact main commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-server-image
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: stabbur
          persist-credentials: false
      - name: Verify exact source and installation evidence
        id: evidence
        run: |
          python3 stabbur/scripts/verify-image-publication.py \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" --evidence-dir "$RUNNER_TEMP/acceptance"
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: terjekv/stabbur-client-rust
          ref: ${{ steps.evidence.outputs.client_sha }}
          path: stabbur-client-rust
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push server image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: stabbur
          file: stabbur/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/terjekv/stabbur-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/terjekv/stabbur
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-publication
          cache-to: type=gha,mode=max,scope=server-publication
      - name: Exercise supported client against the published digest
        working-directory: stabbur-client-rust
        run: scripts/run-integration-tests.sh
        env:
          STABBUR_INTEGRATION_SERVER_IMAGE: ghcr.io/terjekv/stabbur-server@${{ steps.image.outputs.digest }}
      - name: Record verified image and source evidence
        env:
          IMAGE: ghcr.io/terjekv/stabbur-server@${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'acceptance'
          evidence = json.loads((directory / 'publication-inputs.json').read_text())
          evidence.update(image=os.environ['IMAGE'], platform='linux/amd64', client_compatibility='passed')
          (directory / 'published-image.json').write_text(json.dumps(evidence, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified server image: `' + os.environ['IMAGE'] + '`\n')
          PY
      - name: Upload publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-server-image
          path: ${{ runner.temp }}/acceptance/published-image.json
          if-no-files-found: error
          retention-days: 90
