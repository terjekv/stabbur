name: Scheduled supply-chain audit

on:
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Rust dependency and license policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-08-04
        with:
          toolchain: "1.88"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Scan the complete lockfile for RustSec advisories
        run: cargo audit
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.88"
